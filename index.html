<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plantora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="node_modules/modern-normalize/modern-normalize.css"
    />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <header class="header-container container">
      <div class="container-logo">
        <span class="point-under-logo">
          <svg class="pointer-under-logo">
            <use
              class="point"
              href="./css/image/icon/icon.svg#icon-Logo-dot"
            ></use>
          </svg>
        </span>
        <div class="container-burger-logo">
          <p class="logo">plantora.</p>
          <button class="burger-menu">
            <span class="burger-line"></span>
            <span class="burger-line"></span><span class="burger-line"></span>
          </button>
        </div>
      </div>
    </header>
    <main>
      <section class="hero container">
        <div class="hero-title-content">
          <p class="text-title-elow">A LITTLE MORE GREEN, EVERY DAY</p>
          <h1 class="title">Bring nature closer to home.</h1>
          <p class="text-title">
            Thoughtfully chosen plants to make your space feel calmer, fresher
            and more alive.
          </p>
        </div>
        <button class="button-hero"  type="button">
Explore plants
        </button>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
